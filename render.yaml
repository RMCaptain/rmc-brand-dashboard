services:
  - type: web
    name: rmc-brand-dashboard
    env: node
    plan: standard
    # Install Chrome into the project-local cache (.puppeteerrc.cjs) so it
    # persists into the runtime container. Without the explicit browsers
    # install, the PDF export endpoints 500 with "Browser was not found".
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SYNC_ENABLED
        value: "true"
      - key: SLACK_DIGEST_ENABLED
        value: "false"
      - key: PORT
        generateValue: false
      # Set these in the Render dashboard — do not commit values
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SP_API_CLIENT_ID
        sync: false
      - key: SP_API_CLIENT_SECRET
        sync: false
      - key: SP_API_REFRESH_TOKEN
        sync: false
      - key: SP_API_SELLER_ID
        sync: false
      - key: SP_API_MARKETPLACE_IDS
        sync: false
      - key: ADS_CLIENT_ID
        sync: false
      - key: ADS_CLIENT_SECRET
        sync: false
      - key: ADS_REFRESH_TOKEN
        sync: false
      - key: ADS_PROFILE_CA
        sync: false
      - key: ADS_PROFILE_US
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      # Security / feature env (set in dashboard — declared here so IaC review
      # sees the full surface; audit F12):
      - key: MCP_TOKEN            # claude.ai connector path token — REQUIRED, no code fallback once rotated
        sync: false
      - key: GOOGLE_CLIENT_ID     # team Google sign-in
        sync: false
      - key: TEAM_ALLOWED_DOMAIN  # default rockymountainco.ca
        sync: false
      - key: TEAM_ALLOWED_EMAILS
        sync: false
      - key: TEAM_BASIC_AUTH      # 'off' disables shared-password fallback (internal callers now token-based)
        sync: false
      - key: PORTAL_BASE_URL      # canonical portal origin for emailed links
        sync: false
      - key: RESEND_API_KEY       # portal invite/magic-link email
        sync: false
      - key: ANTHROPIC_API_KEY    # AI executive summaries
        sync: false
      - key: DATABASE_URL         # session-pooler URI — enables boot migrations
        sync: false
      - key: SLACK_INTEGRITY_WEBHOOK_URL
        sync: false
      # Sellerboard Settings → Automation report links (the URL is the credential)
      - key: SELLERBOARD_FEED_RMC     # Rocky Mountain Co account (Amazon CA/US)
        sync: false
      - key: SELLERBOARD_FEED_WMCA    # RMC WMCA (Walmart.ca)
        sync: false
      - key: SELLERBOARD_FEED_INTL    # RMCo Intl (Amazon UK/EU)
        sync: false
      - key: SLACK_AUDIT_WEBHOOK_URL
        sync: false
